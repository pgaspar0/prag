services:
  db:
    image: pgvector/pgvector:pg16
    container_name: prag_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: prag_db
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - prag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prag_pgdata:
