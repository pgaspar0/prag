[project]
name = "prag-backend"
version = "0.1.0"
description = "PRAG: Precise RAG with Citations & Benchmarks Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "pgvector>=0.3.6",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "slowapi>=0.1.9",
    "pymupdf>=1.24.14",
    "google-genai>=0.1.1",
    "boto3>=1.34.0",
    "aiofiles>=24.1.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
